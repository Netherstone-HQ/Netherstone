name: Release cache

# A tag run can only restore caches saved on its own tag or on main, so each
# release used to compile every Rust crate from scratch. This compiles the
# release builds on main and saves their caches under the same keys the
# Release workflow restores, leaving a tag to rebuild only the app crate.
#
# The cache key changes with Cargo.lock and the Rust version, so it is rebuilt
# when the Rust dependencies change, and weekly to pick up a new stable Rust
# and to keep GitHub from evicting caches unused for 7 days. A version bump
# also changes Cargo.lock but leaves the dependencies alone, so it skips the
# rebuild and the tag reuses the last cache.

on:
  push:
    branches: [main]
    paths:
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - .github/workflows/release-cache.yml
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

env:
  # Same as the Release workflow.
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  # Whether this push only bumps the app's version (scripts/version-bump.mjs).
  # If the check fails, the caches are rebuilt anyway.
  changes:
    name: Version bump check
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      bump: ${{ steps.check.outputs.bump }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: false

      - id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --quiet --depth=1 origin "$BEFORE"
          echo "bump=$(node scripts/version-bump.mjs "$BEFORE" "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

  build:
    name: Cache (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.bump != 'true' }}
    # Per target, so a version bump that skips its builds doesn't cancel a
    # rebuild still running for an earlier push.
    concurrency:
      group: release-cache-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      # Keep in step with the build matrix in release.yml.
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - name: Windows
            platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # rust-cache leaves `key` out when shared-key is set, so the target
          # goes in here, or both macOS builds would share one cache.
          shared-key: release-${{ matrix.platform }}-${{ matrix.rust-targets }}

      - run: pnpm install --frozen-lockfile

      # The same cargo build the Release workflow runs, without the installers.
      - run: pnpm tauri build --no-bundle ${{ matrix.args }}
