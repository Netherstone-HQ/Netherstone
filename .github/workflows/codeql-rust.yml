name: CodeQL (Rust)

# Scanning the Rust backend takes several minutes, so it has its own workflow
# and isn't a required check. A pull request is scanned when it changes the
# Rust code or this file, so every Rust change is scanned before it merges.
# Main is scanned once a day instead of on every push, which keeps its results
# current for pull requests to compare against. A pull request that skips it
# shows "1 configuration not found", since main has a Rust scan to compare to.

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/codeql-rust.yml"
  schedule:
    - cron: "17 4 * * *"

# A new push to a pull request replaces its scan.
concurrency:
  group: codeql-rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:rust
