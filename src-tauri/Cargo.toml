[package]
name = "Netherstone"
version = "0.1.0-beta.2"
description = "Your favorite Knowledge Base"
authors = ["wsoltani"]
license = "GPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "netherstone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-mini = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
pulldown-cmark = "0.12"
dirs = "5.0"
md5 = "0.7"
blake3 = "1"
trash = "5"
urlencoding = "2.1"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "https"] }
keyring = "4.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "native-tls"] }
tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Builds OpenSSL into the app: macOS has no system OpenSSL to link against at
# runtime, and the Intel build is cross-compiled on Apple Silicon.
git2 = { version = "0.21", default-features = false, features = ["vendored-openssl"] }
objc2-web-kit = "0.3"
# PDF export prints the webview through AppKit's print system.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSWindow", "NSResponder", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary", "NSGeometry"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"
webkit2gtk = "2"
