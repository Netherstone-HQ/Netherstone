name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The front-end and browser jobs skip a run that only changes docs, like the
  # Rust job below.
  frontend:
    name: Typecheck and test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

  # The slowest job, so its tests are split across two runners.
  # A matrix job skipped as a whole reports one check with the matrix left
  # unexpanded, so the required "(1/2)" and "(2/2)" checks would never report.
  # A docs-only run still starts both shards and skips their steps instead.
  browser-shard:
    name: Browser tests (${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST: ${{ needs.changes.result != 'success' || needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - if: env.TEST == 'true'
        uses: actions/checkout@v7

      - if: env.TEST == 'true'
        uses: pnpm/action-setup@v6

      - if: env.TEST == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - if: env.TEST == 'true'
        run: pnpm install --frozen-lockfile

      - if: env.TEST == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        if: env.TEST == 'true'
        run: pnpm exec vite build

      # Editor tests in a real Chromium against the built app, with the
      # desktop bridge mocked (see e2e/vault.ts).
      - name: Test
        if: env.TEST == 'true'
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # One check that passes only when every shard did, so the check keeps its
  # name however many shards there are.
  browser:
    name: Browser tests
    needs: [changes, browser-shard]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - if: needs.browser-shard.result != 'success'
        run: exit 1

  # What this run needs to test. A run that only changes docs (Markdown at the
  # root or in .github/, or docs/) tests nothing. Otherwise a push to main tests
  # everything, and a pull request runs the Rust tests only when it changes
  # src-tauri/ or this file.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.check.outputs.rust }}
      code: ${{ steps.check.outputs.code }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')
          else
            files=everything
          fi
          if grep -qvE '^(docs/|[^/]+\.md$|\.github/[^/]+\.md$)' <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            grep -qvE '^(docs/|[^/]+\.md$|\.github/[^/]+\.md$)' <<< "$files" && rust=true || rust=false
          elif grep -qE '^(src-tauri/|\.github/workflows/ci\.yml$)' <<< "$files"; then
            rust=true
          else
            rust=false
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  # A skipped job counts as passed, so a required check doesn't hold up a
  # pull request it has nothing to test. If the file check fails, every job
  # runs anyway.
  rust:
    name: Rust tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! needs the frontend output folder to exist.
      - run: mkdir -p dist

      - name: Test
        working-directory: src-tauri
        run: cargo test
