name: Android

# Builds the Android app on request: the phone APKs against the size budget,
# and x86_64 driven on an emulator. "Report only" keeps failed checks from
# failing the run.
on:
  workflow_dispatch:
    inputs:
      report:
        description: Report only
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: 29.0.14206865
  SDK_TOOLS_SHA256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee

jobs:
  build:
    name: Android ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # What ships to phones: checked against the size budget.
          - target: aarch64
            rust: aarch64-linux-android
            env: aarch64_linux_android
            inspectable: false
          - target: armv7
            rust: armv7-linux-androideabi
            env: armv7_linux_androideabi
            inspectable: false
          # What the emulator runs: DevTools on, so the check can read the page.
          - target: x86_64
            rust: x86_64-linux-android
            env: x86_64_linux_android
            inspectable: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          # Keeps Gradle's downloads between runs: Maven Central turns away
          # runners that ask too often.
          cache: gradle
          cache-dependency-path: |
            src-tauri/gen/android/**/*.gradle*
            src-tauri/gen/android/**/gradle-wrapper.properties
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-${{ matrix.target }}

      # The runner's own SDK tools are too old to list the Android 37 platform.
      - name: Android NDK and platform
        run: |
          curl -sSLo /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          echo "$SDK_TOOLS_SHA256  /tmp/tools.zip" | sha256sum --check
          unzip -q /tmp/tools.zip -d /tmp/tools
          SDKMANAGER="/tmp/tools/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME"
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER "platforms;android-37.0" "build-tools;36.0.0" "ndk;$NDK_VERSION" > /dev/null

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          ORG_GRADLE_PROJECT_netherstoneInspectable: ${{ matrix.inspectable }}
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # OpenSSL's build looks for ranlib and ar under the target's name.
          export RANLIB_${{ matrix.env }}="$BIN/llvm-ranlib" AR_${{ matrix.env }}="$BIN/llvm-ar"
          export PATH="$BIN:$PATH"
          pnpm tauri android build --apk --target ${{ matrix.target }}
          mv src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk netherstone-${{ matrix.target }}.apk

      - name: Size
        if: matrix.target != 'x86_64'
        run: node scripts/apk-size.mjs netherstone-${{ matrix.target }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.target }}
          path: netherstone-${{ matrix.target }}.apk

  # The app driven on an emulator (scripts/android-ui-check.mjs), and the
  # editor with the system keyboard (scripts/android-editor-check.mjs).
  # The editor check has sound on, for a microphone, and a back camera.
  check:
    name: Android ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: emulator
            script: android-ui-check
            options: -no-audio -camera-back none
          - name: editor
            script: android-editor-check
            options: -camera-back emulated
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # The checks drive the app with Playwright's Android support.
      - run: pnpm install --frozen-lockfile
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: apk-x86_64
      - uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: ${{ inputs.report }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim ${{ matrix.options }}
          script: APK=netherstone-x86_64.apk node scripts/${{ matrix.script }}.mjs ${{ matrix.script }}
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.script }}
          path: ${{ matrix.script }}
