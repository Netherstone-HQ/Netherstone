allowBuilds:
  esbuild: true
  msw: true
  # Only sass's --watch mode uses it; the build never does.
  '@parcel/watcher': false

patchedDependencies:
  '@excalidraw/excalidraw': patches/@excalidraw__excalidraw.patch
  # Every node component looked up the editor through Plate's store, a few
  # hooks and a subscription each, many times per block: most of a long
  # shard's memory. Read from a context inside Plate now. Still in Plate 53.5.
  '@platejs/core': patches/@platejs__core.patch
  # Saving looked up every mark's plugin for each piece of text, and a mark
  # with no plugin here (comment, highlight, kbd, ...) built and resolved a
  # new plugin on each lookup: most of a long shard's save. Looked up once
  # now, same Markdown. Still in Plate 53.5.
  '@platejs/markdown': patches/@platejs__markdown.patch
  # The equation hook imported KaTeX (260 KB) at load, so it was in the
  # startup script. It loads KaTeX with the first equation shown now.
  '@platejs/math': patches/@platejs__math.patch
  # Fixes copying an empty last block, pasting over selected blocks, and
  # Enter on selected blocks, whose caret Plate dropped on the way to focus.
  # Keeps selected blocks when the editor, losing focus to them, puts back
  # the caret it already has (Slate 0.145).
  '@platejs/selection': patches/@platejs__selection.patch
  # useAtomValue re-rendered every component once after mounting, even with
  # nothing changed, so a long shard kept two copies of each block's React
  # state. Re-renders only on a change now. Still in jotai 2.19. Plate's copy.
  jotai@2.8.4: patches/jotai@2.8.4.patch
  # React saves the caret of a focused contenteditable before each commit by
  # walking all of its DOM, and uses it only when focus moved. Skipped for the
  # Slate editor, which sets its own caret. Recheck on every React upgrade.
  react-dom: patches/react-dom.patch
  # On Android, reading a caret in text the keyboard had just removed threw
  # instead of returning nothing (slate#6346). Fixed in slate-dom 0.147.3,
  # which Plate 53.5 doesn't use yet.
  slate-dom: patches/slate-dom.patch
  # With the caret in an input inside the editor (the / and @ menus), Slate
  # moved the page's caret back into the editor text, so the input took no
  # typing in WebKit (slate#6360). Only done while the editor has focus now.
  # Also: on Android, a Gboard correction aimed outside the editor put the
  # corrected word after the typed one ("ratherather") instead of replacing
  # it (slate#6358). Fixed in slate-react 0.147.5, which Plate 53.5 doesn't
  # use yet. Those two can go once Plate moves to slate-react 0.147.5.
  # Also on Android: after applying typed text, slate focused the editor
  # again, taking focus from the / and @ menus' search so they closed at
  # once. Check that the new version keeps that focus before dropping it.
  slate-react: patches/slate-react.patch

overrides:
  # @platejs/math pins katex 0.16.22 while everything else uses 0.16.45, which
  # put two copies in the app. Drop once @platejs/math moves past 0.16.22.
  '@platejs/math>katex': 0.16.45
