allowBuilds:
  esbuild: true
  msw: true
  # Only sass's --watch mode uses it; the build never does.
  '@parcel/watcher': false

patchedDependencies:
  '@excalidraw/excalidraw': patches/@excalidraw__excalidraw.patch
  # Stops a change in one table cell re-rendering every other cell. Plate
  # 53.5 does the same upstream, but needs a Slate upgrade first. Read an
  # ancestor element with useElementSelector, not useElement(key), which
  # can now return the ancestor as it was when the child last rendered.
  '@platejs/core': patches/@platejs__core.patch
  # Fixes copying an empty last block, pasting over selected blocks, and
  # Enter on selected blocks, whose caret Plate dropped on the way to focus.
  '@platejs/selection': patches/@platejs__selection.patch
  # React saves the caret of a focused contenteditable before each commit by
  # walking all of its DOM, and uses it only when focus moved. Skipped for the
  # Slate editor, which sets its own caret. Recheck on every React upgrade.
  react-dom: patches/react-dom.patch

overrides:
  # @platejs/math pins katex 0.16.22 while everything else uses 0.16.45, which
  # put two copies in the app. Drop once @platejs/math moves past 0.16.22.
  '@platejs/math>katex': 0.16.45
