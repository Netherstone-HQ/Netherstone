name: CodeQL (Rust)

# Scanning the Rust backend takes several minutes, so it has its own workflow
# and isn't a required check. On a pull request it only runs when the Rust code
# or this file changes, and on main it skips a push that only changes docs.
# A pull request that skips it shows "1 configuration not found",
# since main has a Rust scan to compare to.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/*.md"
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/codeql-rust.yml"
  schedule:
    - cron: "17 4 * * 1"

# A new push to a pull request replaces its scan. Every push to main keeps its
# own, so merging twice in a row doesn't cancel the first.
concurrency:
  group: codeql-rust-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:rust
