name: CodeQL (Rust)

# Scanning the Rust backend takes several minutes, so pull requests only run
# it when they change Rust code or its dependencies. Every push to main and
# the weekly run scan it all.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src-tauri/**/*.rs"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/codeql-rust.yml"
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: codeql-rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:rust
