name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The front-end and browser jobs skip a run that only changes docs or bumps
  # the version, like the Rust job below, and a pull request that only changes
  # the Rust code.
  frontend:
    name: Typecheck and test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

  # The slowest job, so its tests are split across two runners.
  # A matrix job skipped as a whole reports one check with the matrix left
  # unexpanded, so the required "(1/2)" and "(2/2)" checks would never report.
  # A run with nothing for them to test still starts both shards and skips their
  # steps instead.
  # The tests run in Playwright's image, which already has Chromium and the
  # system libraries it needs, so no packages come from the Ubuntu mirror. Its
  # tag follows the Playwright version in package.json. A run with nothing to
  # test uses no image.
  browser-shard:
    name: Browser tests (${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    container: ${{ (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') && format('mcr.microsoft.com/playwright:v{0}-noble', needs.changes.outputs.playwright) || '' }}
    timeout-minutes: 20
    env:
      TEST: ${{ needs.changes.result != 'success' || needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - if: env.TEST == 'true'
        uses: actions/checkout@v7

      - if: env.TEST == 'true'
        uses: pnpm/action-setup@v6

      - if: env.TEST == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - if: env.TEST == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: env.TEST == 'true'
        run: pnpm exec vite build

      # Editor tests in a real Chromium against the built app, with the
      # desktop bridge mocked (see e2e/vault.ts).
      - name: Test
        if: env.TEST == 'true'
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # One check that passes only when every shard did, so the check keeps its
  # name however many shards there are.
  browser:
    name: Browser tests
    needs: [changes, browser-shard]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - if: needs.browser-shard.result != 'success'
        run: exit 1

  # What this run needs to test. A run that only changes docs (Markdown at the
  # root or in .github/, or docs/) tests nothing. A pull request that only
  # bumps the app's version (scripts/version-bump.mjs) only checks Cargo.lock.
  # Otherwise a push to main tests everything, a pull request runs the Rust
  # tests only when it changes src-tauri/ or this file, and the other tests
  # only when it changes something outside src-tauri/.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.check.outputs.rust }}
      code: ${{ steps.check.outputs.code }}
      playwright: ${{ steps.playwright.outputs.version }}
      bump: ${{ steps.check.outputs.bump }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the
      # base branch, so two commits are enough to see what it changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout: |
            package.json
            scripts/
          sparse-checkout-cone-mode: false

      - id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          bump=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
            bump=$(node scripts/version-bump.mjs HEAD^1 HEAD)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')
          else
            files=everything
          fi
          # A pull request that only changes the Rust code skips the
          # front-end and browser tests, which mock the Rust side. Those tests
          # read tauri.conf.json, so a change to it still runs them.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            skip='^(docs/|[^/]+\.md$|\.github/[^/]+\.md$|src-tauri/(?!tauri\.conf\.json$))'
          else
            skip='^(docs/|[^/]+\.md$|\.github/[^/]+\.md$)'
          fi
          if [ "$bump" != "true" ] && grep -qvP "$skip" <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            grep -qvE '^(docs/|[^/]+\.md$|\.github/[^/]+\.md$)' <<< "$files" && rust=true || rust=false
          elif grep -qE '^(src-tauri/|\.github/workflows/ci\.yml$)' <<< "$files"; then
            rust=true
          else
            rust=false
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

  # A skipped job counts as passed, so a required check doesn't hold up a
  # pull request it has nothing to test. If the file check fails, every job
  # runs anyway. A version bump only checks that Cargo.lock matches Cargo.toml,
  # which is quick and needs no system libraries.
  rust:
    name: Rust tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUMP: ${{ needs.changes.outputs.bump }}
    steps:
      - uses: actions/checkout@v7

      # The Ubuntu mirror often stalls, so the downloaded packages are cached
      # for each runner image and only new versions come from the mirror.
      - name: Prepare package cache
        id: apt
        if: env.BUMP != 'true'
        run: |
          sudo install -d -o "$USER" /var/cache/tauri-apt
          echo "key=tauri-apt-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        if: env.BUMP != 'true'
        with:
          path: /var/cache/tauri-apt/*.deb
          key: ${{ steps.apt.outputs.key }}
          restore-keys: tauri-apt-

      # Fails fast when the Ubuntu mirror stalls instead of holding the job.
      - name: Install Tauri system libraries
        if: env.BUMP != 'true'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives=/var/cache/tauri-apt -o APT::Keep-Downloaded-Packages=true libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: env.BUMP != 'true'
        with:
          workspaces: src-tauri

      # tauri::generate_context! needs the frontend output folder to exist.
      - if: env.BUMP != 'true'
        run: mkdir -p dist

      - name: Test
        if: env.BUMP != 'true'
        working-directory: src-tauri
        run: cargo test

      - name: Check Cargo.lock
        if: env.BUMP == 'true'
        working-directory: src-tauri
        run: cargo metadata --locked --format-version 1 > /dev/null
